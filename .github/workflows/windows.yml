name: Windows build and validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .binary-cache
          key: windows-msvc-${{ hashFiles('vcpkg.json') }}
      - name: Configure, build, test
        shell: pwsh
        run: ./tools/build.ps1
      - name: Validate references and original/optimized paths
        shell: pwsh
        run: ./tools/verify.ps1 -SkipDesktop -OutputDirectory results/ci-acceptance
      - name: Package portable Windows build
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            results/
            build/windows/Testing/Temporary/LastTest.log
            dist/*.zip
